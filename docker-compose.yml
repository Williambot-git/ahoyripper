services:
  ahoyripper:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      # AHOY_UNLIMITED_KEY must be set in production — a hardcoded fallback is
      # intentionally NOT provided here. Using the default key in production gives
      # everyone unlimited quota. Generate a secure key with:
      #   openssl rand -hex 32
      # Then pass it via: echo "AHOY_UNLIMITED_KEY=$(openssl rand -hex 32)" > .env
      - AHOY_UNLIMITED_KEY=${AHOY_UNLIMITED_KEY:-}
      - AHOY_USER_AGENT=${AHOY_USER_AGENT:-}
      - COOKIES_PATH=${COOKIES_PATH:-}
      - QUOTA_DAILY=${QUOTA_DAILY:-5}
      - YTDLP_TIMEOUT=${YTDLP_TIMEOUT:-45}
      - YTDLP_DOWNLOAD_TIMEOUT=${YTDLP_DOWNLOAD_TIMEOUT:-300}
      - HEALTH_PROBE_TIMEOUT=${HEALTH_PROBE_TIMEOUT:-15}
      - FFPROBE_TIMEOUT=${FFPROBE_TIMEOUT:-10}
      - DL_RATE_LIMIT=${DL_RATE_LIMIT:-10}
      # YTDLP_VERSION: yt-dlp release version to install.
      # Use 'latest' (default) to always use the newest release for automatic updates.
      # Pin to a specific version (e.g. '2024.08.06') for reproducible builds and
      # to avoid unexpected breaking changes. The Docker build verifies the SHA256
      # checksum and validates the installed version matches the pinned version.
      # See: https://github.com/yt-dlp/yt-dlp/releases
      - YTDLP_VERSION=${YTDLP_VERSION:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/src/api.php?action=check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
