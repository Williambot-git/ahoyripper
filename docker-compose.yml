services:
  ahoyripper:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
      # AHOY_UNLIMITED_KEY must be set in production — a hardcoded fallback is
      # intentionally NOT provided here. Using the default key in production gives
      # everyone unlimited quota. Generate a secure key with:
      #   openssl rand -hex 32
      # Then pass it via: echo "AHOY_UNLIMITED_KEY=$(openssl rand -hex 32)" > .env
      # AHOY_KEY is an alias for AHOY_UNLIMITED_KEY — both env vars set the same
      # value. Using AHOY_KEY in .env is equivalent to using AHOY_UNLIMITED_KEY.
      - AHOY_KEY=${AHOY_KEY:-}
      - AHOY_UNLIMITED_KEY=${AHOY_UNLIMITED_KEY:-}
      - AHOY_USER_AGENT=${AHOY_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36}
      - AHOY_IMPERSONATE=${AHOY_IMPERSONATE:-chrome}
      - COOKIES_PATH=${COOKIES_PATH:-}
      - QUOTA_DAILY=${QUOTA_DAILY:-5}
      - YTDLP_TIMEOUT=${YTDLP_TIMEOUT:-45}
      - YTDLP_DOWNLOAD_TIMEOUT=${YTDLP_DOWNLOAD_TIMEOUT:-300}
      - HEALTH_PROBE_TIMEOUT=${HEALTH_PROBE_TIMEOUT:-15}
      - HEALTH_PROBE_VIDEO_ID=${HEALTH_PROBE_VIDEO_ID:-dQw4w9WgXcQ}
      - FFPROBE_TIMEOUT=${FFPROBE_TIMEOUT:-10}
      - DL_RATE_LIMIT=${DL_RATE_LIMIT:-10}
      - RATE_LIMIT=${RATE_LIMIT:-30}
      # PLAUSIBLE_HOST: empty (default) routes analytics through the self-hosted
      # /src/api.php?action=analytics proxy — no third-party requests leave the
      # browser. Set to 'plausible.io' (or your self-hosted domain) to forward
      # events directly to Plausible. Set to empty string '' to disable entirely.
      - PLAUSIBLE_HOST=${PLAUSIBLE_HOST:-}
      # YTDLP_VERSION: yt-dlp release version to install.
      # Use 'latest' (default) to always use the newest release for automatic updates.
      # Pin to a specific version (e.g. '2024.08.06') for reproducible builds and
      # to avoid unexpected breaking changes. The Docker build verifies the SHA256
      # checksum and validates the installed version matches the pinned version.
      # See: https://github.com/yt-dlp/yt-dlp/releases
      - YTDLP_VERSION=${YTDLP_VERSION:-latest}
      - VERSION_CACHE_TTL=${VERSION_CACHE_TTL:-3600}
      - PROBE_CACHE_TTL=${PROBE_CACHE_TTL:-300}
      # MAX_URL_LEN: maximum source URL length accepted by the API.
      # The default of 2048 handles exceptionally long URLs (e.g. URLs with
      # many query parameters). Decrease to enforce stricter input limits.
      - MAX_URL_LEN=${MAX_URL_LEN:-2048}
      # MAX_FILENAME_LEN: maximum filename length after sanitization.
      # The default of 80 balances cross-platform compatibility (ext4 255-byte
      # limit, FAT32 260-char limit) with descriptive filenames. Decrease for
      # stricter limits, increase for longer descriptive titles.
      - MAX_FILENAME_LEN=${MAX_FILENAME_LEN:-80}
      # API_KEY_LEN: maximum accepted API key length for timing-safe comparison.
      # Should match the maximum length of keys generated by AhoyVPN's key
      # generation (openssl rand -hex 32 produces 64 characters).
      - API_KEY_LEN=${API_KEY_LEN:-64}
      # QUOTA_DIR: directory for daily-quota and rate-limit state files.
      # Defaults to /tmp/quota (tmpfs mount) so Docker container restarts wipe
      # quota state, preventing quota bypass via container restart, while keeping
      # the state files in the dedicated tmpfs mount rather than the system /tmp.
      # Mount a persistent volume for quota to survive restarts (e.g.
      # QUOTA_DIR=/var/run/ahoyripper/quota with a corresponding Docker
      # volume mount). Requires the directory to exist and be writable by PHP.
      # Docker: QUOTA_DIR=/tmp/quota (matches the tmpfs mount at /tmp/quota)
      - QUOTA_DIR=${QUOTA_DIR:-/tmp/quota}
    restart: unless-stopped
    healthcheck:
      # Use / (root) instead of /src/api.php — the nginx Docker config serves the
      # API from root /app/public with "location = /src/api.php", which maps to
      # /app/public/src/api.php (does not exist). The root location handles PHP
      # via the ~ \.php$ block and correctly routes /?action=check to api.php.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/?action=check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    # tmpfs mount for quota/state files — required because read_only=true prevents
    # writing to /tmp. Using a tmpfs (ramdisk) keeps the quota state in memory,
    # preserving the security benefit of stateless /tmp (wiped on container restart)
    # while enabling the quota subsystem to function.
    # uid=1000,gid=1000 must match the www-data user/group created in the
    # Dockerfile (groupadd --gid 1000 www-data && useradd --uid 1000 ...).
    # If the Dockerfile's www-data uid/gid changes, update these values to match.
    tmpfs:
      - /tmp/quota:size=16M,mode=01775,uid=1000,gid=1000
